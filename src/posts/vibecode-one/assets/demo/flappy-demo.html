<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Bird 3D Pixelated</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      margin: 0;
      overflow: hidden;
      background: #87CEEB;
      font-family: 'Press Start 2P', monospace;
    }
    
    canvas {
      display: block;
    }
    
    #ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    #score {
      font-size: 48px;
      color: #fff;
      text-shadow: 4px 4px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
      margin-top: 30px;
      z-index: 10;
    }
    
    #message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #fff;
      text-shadow: 4px 4px 0 #000;
    }
    
    #message h1 {
      font-size: 36px;
      margin-bottom: 20px;
      color: #FFD700;
      text-shadow: 4px 4px 0 #000;
    }
    
    #message p {
      font-size: 16px;
      animation: blink 1s infinite;
    }
    
    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }
    
    #final-score {
      font-size: 24px;
      color: #FFD700;
      margin-bottom: 30px;
    }
    
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="ui">
      <div id="score">0</div>
      <div id="message">
        <h1>FLAPPY BIRD 3D</h1>
        <p>CLICK TO START</p>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const CONFIG = {
      gravity: -25,
      jumpVelocity: 10,
      horizontalSpeed: 8,
      pipeSpawnInterval: 1500,
      pipeGap: 6,
      pipeWidth: 1.5,
      birdSize: 0.8,
      groundHeight: 2,
      ceilingLimit: 15
    };

    let scene, camera, renderer;
    let bird, pipes = [], clouds = [];
    let score = 0;
    let gameState = 'waiting';
    let velocityY = 0;
    let lastPipeTime = 0;
    let ground;

    const scoreEl = document.getElementById('score');
    const messageEl = document.getElementById('message');
    const gameContainer = document.getElementById('game-container');

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87CEEB);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 2, 20);
      camera.lookAt(0, 2, 0);

      renderer = new THREE.WebGLRenderer({ antialias: false });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(1);
      document.body.appendChild(renderer.domElement);

      const ambientLight = new THREE.AmbientLight(0xffe4c4, 0.6);
      scene.add(ambientLight);

      const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
      directionalLight.position.set(5, 10, 7);
      scene.add(directionalLight);

      createGround();
      createBird();
      createClouds();

      window.addEventListener('resize', onWindowResize);
      window.addEventListener('click', onInteract);
      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          e.preventDefault();
          onInteract();
        }
      });
      window.addEventListener('touchstart', onInteract);

      animate();
    }

    function createPixelBox(width, height, depth, color, edgeColor) {
      const group = new THREE.Group();
      
      const geometry = new THREE.BoxGeometry(width, height, depth);
      const material = new THREE.MeshLambertMaterial({ color: color });
      const mesh = new THREE.Mesh(geometry, material);
      group.add(mesh);
      
      if (edgeColor) {
        const edgeGeo = new THREE.BoxGeometry(width * 1.05, height * 1.05, depth * 1.05);
        const edgeMat = new THREE.MeshBasicMaterial({ color: edgeColor });
        const edge = new THREE.Mesh(edgeGeo, edgeMat);
        edge.position.z = -0.01;
        group.add(edge);
      }
      
      return group;
    }

    function createGround() {
      ground = createPixelBox(100, CONFIG.groundHeight, 2, 0x8B4513, 0x654321);
      ground.position.set(0, -CONFIG.groundHeight / 2, 0);
      scene.add(ground);

      const groundStripes = createPixelBox(100, 0.3, 2.1, 0x228B22, null);
      groundStripes.position.set(0, 0, 0);
      scene.add(groundStripes);
    }

    function createBird() {
      bird = new THREE.Group();
      
      const body = createPixelBox(CONFIG.birdSize, CONFIG.birdSize, CONFIG.birdSize, 0xFFD700, 0xFFA500);
      bird.add(body);
      
      const eye = createPixelBox(0.2, 0.2, 0.1, 0x000000, null);
      eye.position.set(0.2, 0.25, 0.4);
      bird.add(eye);
      
      const beak = createPixelBox(0.3, 0.15, 0.2, 0xFF6600, null);
      beak.position.set(0.35, -0.1, 0.35);
      bird.add(beak);
      
      const wing = createPixelBox(0.4, 0.3, 0.15, 0xFFA500, null);
      wing.position.set(-0.1, -0.1, 0.4);
      bird.add(wing);
      
      bird.position.set(-5, 2, 0);
      scene.add(bird);
    }

    function createClouds() {
      for (let i = 0; i < 8; i++) {
        const cloud = new THREE.Group();
        const numCubes = 3 + Math.floor(Math.random() * 3);
        
        for (let j = 0; j < numCubes; j++) {
          const size = 0.8 + Math.random() * 0.8;
          const cube = createPixelBox(size, size * 0.6, size, 0xffffff, 0xcccccc);
          cube.position.set(
            (j - numCubes / 2) * 0.7,
            Math.random() * 0.3,
            0
          );
          cloud.add(cube);
        }
        
        cloud.position.set(
          -30 + Math.random() * 60,
          8 + Math.random() * 6,
          -5 - Math.random() * 10
        );
        cloud.userData.speed = 0.5 + Math.random() * 0.5;
        clouds.push(cloud);
        scene.add(cloud);
      }
    }

    function spawnPipe() {
      const pipeX = 15;
      const gapCenter = 2 + Math.random() * 4;
      const gapHalf = CONFIG.pipeGap / 2;
      const topY = 12;
      const bottomY = -1;
      
      const topPipeHeight = topY - (gapCenter + gapHalf);
      const bottomPipeHeight = (gapCenter - gapHalf) - bottomY;
      
      const topPipe = createPixelBox(CONFIG.pipeWidth, topPipeHeight, CONFIG.pipeWidth, 0x228B22, 0x006400);
      topPipe.position.set(pipeX, gapCenter + gapHalf + topPipeHeight / 2, 0);
      scene.add(topPipe);
      
      const bottomPipe = createPixelBox(CONFIG.pipeWidth, bottomPipeHeight, CONFIG.pipeWidth, 0x228B22, 0x006400);
      bottomPipe.position.set(pipeX, bottomY + bottomPipeHeight / 2, 0);
      scene.add(bottomPipe);
      
      const capTop = createPixelBox(CONFIG.pipeWidth + 0.3, 0.5, CONFIG.pipeWidth + 0.3, 0x006400, null);
      capTop.position.set(pipeX, gapCenter + gapHalf, 0);
      scene.add(capTop);
      
      const capBottom = createPixelBox(CONFIG.pipeWidth + 0.3, 0.5, CONFIG.pipeWidth + 0.3, 0x006400, null);
      capBottom.position.set(pipeX, gapCenter - gapHalf, 0);
      scene.add(capBottom);
      
      pipes.push({
        topMesh: topPipe,
        bottomMesh: bottomPipe,
        capTop: capTop,
        capBottom: capBottom,
        x: pipeX,
        gapY: gapCenter,
        topHeight: topPipeHeight,
        bottomHeight: bottomPipeHeight,
        passed: false
      });
    }

    function jump() {
      if (gameState === 'waiting' || gameState === 'playing') {
        velocityY = CONFIG.jumpVelocity;
        
        if (gameState === 'waiting') {
          gameState = 'playing';
          messageEl.classList.add('hidden');
          lastPipeTime = Date.now();
        }
      }
    }

    function checkCollision() {
      const birdHalf = CONFIG.birdSize / 2;
      const birdX = bird.position.x;
      const birdY = bird.position.y;
      const halfWidth = CONFIG.pipeWidth / 2;
      const gapHalf = CONFIG.pipeGap / 2;
      
      // Ground collision (ground top at y=0)
      if (birdY - birdHalf < 0) {
        return true;
      }
      // Ceiling collision
      if (birdY + birdHalf > CONFIG.ceilingLimit) {
        return true;
      }
      
      for (const pipe of pipes) {
        const pipeX = pipe.x;
        
        if (birdX + birdHalf > pipeX - halfWidth && birdX - birdHalf < pipeX + halfWidth) {
          // Bird is within pipe's x range, check if it's within the gap
          if (birdY - birdHalf < pipe.gapY - gapHalf || birdY + birdHalf > pipe.gapY + gapHalf) {
            return true;
          }
        }
      }
      
      return false;
    }

    function gameOver() {
      gameState = 'gameover';
      messageEl.innerHTML = `
        <h1>GAME OVER</h1>
        <p id="final-score">SCORE: ${score}</p>
        <p>CLICK TO RESTART</p>
      `;
      messageEl.classList.remove('hidden');
    }

    function restart() {
      for (const pipe of pipes) {
        scene.remove(pipe.topMesh);
        scene.remove(pipe.bottomMesh);
        scene.remove(pipe.capTop);
        scene.remove(pipe.capBottom);
      }
      pipes = [];
      
      bird.position.set(-5, 2, 0);
      velocityY = 0;
      score = 0;
      scoreEl.textContent = '0';
      
      gameState = 'waiting';
      messageEl.innerHTML = `
        <h1>FLAPPY BIRD 3D</h1>
        <p>CLICK TO START</p>
      `;
    }

    function onInteract(e) {
      if (e) e.preventDefault();
      
      if (gameState === 'waiting') {
        jump();
      } else if (gameState === 'playing') {
        jump();
      } else if (gameState === 'gameover') {
        restart();
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    let lastTime = Date.now();
    
    function animate() {
      requestAnimationFrame(animate);
      
      const currentTime = Date.now();
      const deltaTime = Math.min((currentTime - lastTime) / 1000, 0.1);
      lastTime = currentTime;
      
      if (gameState === 'playing') {
        velocityY += CONFIG.gravity * deltaTime;
        bird.position.y += velocityY * deltaTime;
        
        if (bird.rotation.z < 0.3) {
          bird.rotation.z += deltaTime * 2;
        }
        if (velocityY < 0) {
          bird.rotation.z = Math.max(bird.rotation.z - deltaTime * 3, -0.5);
        }
        
        if (currentTime - lastPipeTime > CONFIG.pipeSpawnInterval) {
          spawnPipe();
          lastPipeTime = currentTime;
        }
        
        for (let i = pipes.length - 1; i >= 0; i--) {
          const pipe = pipes[i];
          
          pipe.x -= CONFIG.horizontalSpeed * deltaTime;
          pipe.topMesh.position.x = pipe.x;
          pipe.bottomMesh.position.x = pipe.x;
          pipe.capTop.position.x = pipe.x;
          pipe.capBottom.position.x = pipe.x;
          
          if (!pipe.passed && pipe.x < bird.position.x - 1) {
            pipe.passed = true;
            score++;
            scoreEl.textContent = score;
          }
          
          if (pipe.x < -20) {
            scene.remove(pipe.topMesh);
            scene.remove(pipe.bottomMesh);
            scene.remove(pipe.capTop);
            scene.remove(pipe.capBottom);
            pipes.splice(i, 1);
          }
        }
        
        if (checkCollision()) {
          gameOver();
        }
      }
      
      clouds.forEach(cloud => {
        cloud.position.x -= cloud.userData.speed * deltaTime;
        if (cloud.position.x < -35) {
          cloud.position.x = 35;
        }
      });
      
      renderer.render(scene, camera);
    }

    init();
  </script>
</body>
</html>
